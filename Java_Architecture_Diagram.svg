<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950">
<defs>
<style>
.title{font:bold 34px Arial;fill:#172033}.sub{font:18px Arial;fill:#4b5563}
.head{font:bold 25px Arial;fill:#fff}.label{font:bold 22px Arial;fill:#172033}
.text{font:18px Arial;fill:#263244}.small{font:16px Arial;fill:#374151}
.box{stroke:#334155;stroke-width:2;rx:16}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}
</style>
<marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#334155"/></marker>
</defs>
<rect width="1200" height="950" fill="white"/>
<text x="600" y="55" text-anchor="middle" class="title">Java Architecture — JDK, JRE and JVM</text>
<text x="600" y="87" text-anchor="middle" class="sub">How Java source code becomes a platform-independent application</text>

<rect x="350" y="120" width="500" height="75" class="box" fill="#e8f1ff"/>
<text x="600" y="150" text-anchor="middle" class="label">Java Source Code</text>
<text x="600" y="177" text-anchor="middle" class="small">Example: HelloWorld.java</text>
<path d="M600 195L600 235" class="arrow"/>
<text x="625" y="222" class="small">javac compiler</text>

<rect x="130" y="235" width="940" height="165" class="box" fill="#fff4df"/>
<rect x="130" y="235" width="940" height="55" rx="16" fill="#d97706"/>
<text x="600" y="272" text-anchor="middle" class="head">JDK — Java Development Kit</text>
<text x="160" y="325" class="text">Development tools:</text>
<text x="160" y="355" class="small">• javac — Java compiler</text>
<text x="430" y="355" class="small">• java — application launcher</text>
<text x="730" y="355" class="small">• javadoc — documentation tool</text>
<text x="160" y="382" class="small">• Debugging, packaging and other development utilities</text>

<path d="M600 400L600 440" class="arrow"/>
<text x="620" y="427" class="small">compiled bytecode</text>

<rect x="205" y="440" width="790" height="185" class="box" fill="#e9f8ef"/>
<rect x="205" y="440" width="790" height="55" rx="16" fill="#15803d"/>
<text x="600" y="477" text-anchor="middle" class="head">JRE — Java Runtime Environment</text>
<text x="600" y="520" text-anchor="middle" class="text">Provides the environment required to run Java applications</text>

<rect x="335" y="540" width="530" height="65" class="box" fill="#dff2ff"/>
<text x="600" y="568" text-anchor="middle" class="label">JVM — Java Virtual Machine</text>
<text x="600" y="592" text-anchor="middle" class="small">Loads, verifies and executes Java bytecode</text>

<path d="M600 625L600 665" class="arrow"/>
<text x="620" y="651" class="small">machine-level execution</text>

<rect x="110" y="665" width="980" height="105" class="box" fill="#f3f4f6"/>
<text x="600" y="700" text-anchor="middle" class="label">Operating System &amp; Hardware</text>
<text x="600" y="730" text-anchor="middle" class="small">Windows • Linux • macOS • Other supported platforms</text>
<text x="600" y="754" text-anchor="middle" class="small">The JVM provides the platform-specific implementation needed to run the bytecode.</text>

<rect x="95" y="805" width="1010" height="105" class="box" fill="#f8fafc"/>
<text x="600" y="838" text-anchor="middle" class="label">Platform Independence</text>
<text x="600" y="868" text-anchor="middle" class="small">Java source → bytecode → JVM → platform-specific execution</text>
<text x="600" y="893" text-anchor="middle" class="small">The same .class bytecode can run on different operating systems when a compatible JVM is available.</text>
</svg>